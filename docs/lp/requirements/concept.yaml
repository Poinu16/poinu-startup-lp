project:
  name: "calorie-mate-lp-practice"
  goal: "忙しい朝の学生・若者にカロリーメイトの魅力を伝え、購入につなげる"
  kgi: "商品購入"
  kpi:
    - "購入ボタンのクリック"
    - "商品詳細の閲覧"
    - "再訪・継続購入意向の向上"

persona:
  name: "忙しい朝を過ごす学生・若者"
  age_range: "10代〜20代前半"
  occupation:
    - "学生"
    - "通学・通勤中の若者"
    - "部活や運動をしている人"
  lifestyle:
    - "朝は時間がなく、食事が後回しになりやすい"
    - "移動前に手早く食べられるものを求めている"
    - "日常の中で無理なく続けられるものを選びたい"

pain_points:
  - "朝は忙しく、しっかり食事を取る時間がない"
  - "通学や通勤前に手早く食べられるものがほしい"
  - "部活や運動の前後に、すぐ栄養補給したい"
  - "忙しい毎日の中で、食事が不規則になりやすい"

value_proposition:
  main_benefit: "忙しい朝でも手軽に栄養補給の補助ができる"
  supporting_benefits:
    - "通学・通勤前でも取り入れやすい"
    - "持ち運びやすく、移動前後に食べやすい"
    - "部活や運動時の栄養補給の補助として使いやすい"
    - "毎日の生活に無理なくなじみやすい"

message:
  core_message: "忙しい朝に、すばやく栄養補給。"
  sub_message: "通学・通勤前でも取り入れやすい、手軽な栄養補給の補助。"
  tone:
    - "活発"
    - "明るい"
    - "前向き"
    - "親しみやすい"

hero:
  purpose: "忙しい朝の通学・通勤前に、手軽に栄養補給できる商品だと一瞬で伝える"
  main_copy: "忙しい朝に、すばやく栄養補給。"
  sub_copy: "通学・通勤前でも取り入れやすい、手軽な栄養補給の補助。"
  primary_cta:
    label: "今すぐ購入する"
    action: "購入ページへ遷移"
  visual_direction:
    - "黄色を主体にした明るいデザイン"
    - "朝の通学・通勤シーンを想起できるビジュアル"
    - "商品パッケージが目立つ構成"

design_direction:
  color:
    base: "yellow"
    accent: "dark gray"
    cta: "orange or strong yellow"
  mood:
    - "元気"
    - "スピード感"
    - "朝のスタート感"
  notes:
    - "若者向けなので短くテンポのよいコピーを使う"
    - "CTAは視線誘導しやすい位置に置く"
    - "背景と文字のコントラストをしっかり取る"

sections:
  - name: "Hero"
    purpose: "誰向けの商品で、どんな価値があるかを最初に伝える"
    key_message: "忙しい朝でも、手軽に取り入れやすい栄養補給"
  - name: "課題提起"
    purpose: "朝は忙しく食事が後回しになりやすい悩みに共感してもらう"
    key_message: "朝の時間不足は、多くの学生・若者に共通する悩み"
  - name: "解決策・商品紹介"
    purpose: "手軽さと栄養補給の補助という価値を伝える"
    key_message: "すぐ食べやすく、毎日に取り入れやすい"
  - name: "利用シーン"
    purpose: "通学・通勤前、部活前後など生活への取り入れ方を想像してもらう"
    key_message: "朝の移動前や運動時にも使いやすい"
  - name: "継続利用の後押し"
    purpose: "一度の購入ではなく、習慣化をイメージしてもらう"
    key_message: "毎日のルーティンに取り入れやすい"
  - name: "CTA"
    purpose: "購入行動につなげる"
    key_message: "今すぐ購入して、朝の習慣に取り入れよう"

assets:
  hero_image: "/images/hero/hero-main.webp"
  image_ideas:
    - "朝の通学前に歩く若者"
    - "通勤前に移動するシーン"
    - "商品パッケージを中心にしたキービジュアル"

rules:
  do:
    - "誰向けかを明確に書く"
    - "機能だけでなくベネフィットで伝える"
    - "行動してほしい内容をCTAで明確にする"
  dont:
    - "根拠のないNo.1表現"
    - "医療的・治療的に見える断定表現"
    - "誇大表現"
